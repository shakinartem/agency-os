version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: agency-postgres
    environment:
      POSTGRES_USER: agency
      POSTGRES_PASSWORD: agency_secret
      POSTGRES_DB: agency_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agency -d agency_os"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agency-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: content-factory-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contentfactory}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contentfactory-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: content-factory-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-contentfactory} ${MINIO_ROOT_PASSWORD:-contentfactory-secret};
      mc mb --ignore-existing local/content-assets;
      exit 0;
      "
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: agency-migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://agency:agency_secret@postgres:5432/agency_os
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: agency-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agency:agency_secret@postgres:5432/agency_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: agency-web
    env_file: .env
    ports:
      - "3010:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: agency-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agency:agency_secret@postgres:5432/agency_os
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-contentfactory}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contentfactory-secret}
      S3_BUCKET: content-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
    name: agency-pgdata
  miniodata:
    name: content-factory-miniodata
